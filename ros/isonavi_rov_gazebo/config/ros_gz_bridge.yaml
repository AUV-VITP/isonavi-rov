# ROS 2 <-> Gazebo Harmonic parameter bridge configuration
# Clock
- ros_topic_name: "clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Camera Feed
- ros_topic_name: "camera/image_raw"
  gz_topic_name: "/model/isonavi_rov/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/camera_info"
  gz_topic_name: "/model/isonavi_rov/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# IMU
- ros_topic_name: "imu"
  gz_topic_name: "/model/isonavi_rov/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Fluid Pressure (Hydrostatic Depth)
- ros_topic_name: "fluid_pressure"
  gz_topic_name: "/model/isonavi_rov/fluid_pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "gz.msgs.FluidPressure"
  direction: GZ_TO_ROS

# Odometry
- ros_topic_name: "model/isonavi_rov/odometry"
  gz_topic_name: "/model/isonavi_rov/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

